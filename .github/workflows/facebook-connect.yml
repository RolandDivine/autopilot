name: facebook-connect

# Connect (or reconnect) the Facebook Page. Needs secrets FB_APP_ID, FB_APP_SECRET and a fresh
# FB_USER_TOKEN from Graph API Explorer (it lasts about an hour). Saves a non-expiring Page token.
on:
  workflow_dispatch:
    inputs:
      page:
        description: "Page name or ID (only if you manage more than one Page)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: autopilot-post

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exchange for a Page token
        env:
          PAGE: ${{ inputs.page }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: python scripts/facebook_connect.py
      - name: Save (encrypted)
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add secrets/facebook.enc
          git commit -m "Facebook connected" && git pull --rebase && git push
