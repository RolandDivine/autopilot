name: facebook-mirror

# Copy Instagram posts to the Facebook Page. mode=export lists them; mode=publish posts log/fb_plan.json.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "export or publish"
        required: true
        default: export
        type: string
      limit:
        description: "max posts this run (blank = all)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: facebook-mirror

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: python scripts/fb_mirror.py
      - name: Save log
        if: always()
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add log/ig_media.json log/fb_mirrored.jsonl 2>/dev/null || true
          git commit -m "Facebook mirror: ${{ inputs.mode }}" && git pull --rebase && git push || echo "nothing to save"
