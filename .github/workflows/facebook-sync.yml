name: facebook-sync

# Roland, 5 Nov 2026: every new Instagram post and Reel also goes to the Facebook Page.
# Every 15 minutes, 7 AM-11:59 PM Lagos, at off-peak minutes. Each run copies only Instagram posts
# not yet in log/fb_mirrored.jsonl, so extra or dropped runs are harmless.
on:
  schedule:
    - cron: "7-52/15 6-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: facebook-mirror

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          MODE: sync
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: python scripts/fb_mirror.py
      - name: Save log
        if: always()
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          [ -f log/fb_mirrored.jsonl ] && git add log/fb_mirrored.jsonl
          git commit -m "Facebook sync" && git pull --rebase && git push || echo "nothing to save"
