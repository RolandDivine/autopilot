name: fetch-images

# Downloads generated images (e.g. Figma AI asset URLs, which expire in 7 days) into the repo.
# items: JSON list of {"url": ..., "path": "assets/gen/<name>.jpg"}
on:
  workflow_dispatch:
    inputs:
      items:
        description: 'JSON list of {"url","path"}'
        required: true

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: download
        env:
          ITEMS: ${{ inputs.items }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          for it in json.loads(os.environ["ITEMS"]):
              p = pathlib.Path(it["path"])
              assert p.parts[0] == "assets" and ".." not in p.parts, p
              p.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(it["url"], headers={"User-Agent": "Mozilla/5.0"})
              p.write_bytes(urllib.request.urlopen(req, timeout=60).read())
              print(p, p.stat().st_size)
          PY
      - name: commit
        run: |
          git config user.name "autopilot-bot"
          git config user.email "autopilot-bot@users.noreply.github.com"
          git add assets
          git commit -m "fetch generated images" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
