name: ig-keywords

# Roland, 7 Nov 2026: comment PLAN / SIGNALS / SWAN (or DM the word) -> automatic DM. Dispatched by clock.yml
# every 10 minutes, around the clock. mode: run (default), check (test permissions), dry (show what it would send).
on:
  workflow_dispatch:
    inputs:
      mode: {description: "run | check | dry", required: false, default: "run"}

permissions:
  contents: write

concurrency:
  group: ig-keywords
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            autopilot
            config
            config.json
            state
            secrets
            requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/ig_keywords.py "${MODE:-run}"
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          MODE: ${{ inputs.mode }}
      - name: Save who was answered
        if: ${{ inputs.mode == '' || inputs.mode == 'run' }}
        run: |
          git config user.name "autopilot" && git config user.email "autopilot@users.noreply.github.com"
          git add --sparse state/ig_keywords.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "ig-keywords: replies sent" && git pull --rebase && git push)
