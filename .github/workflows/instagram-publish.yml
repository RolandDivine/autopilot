name: instagram-publish

# Publish images that are already in the repo to Instagram, by hand.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "stories or post"
        type: choice
        options: [stories, post, reel]
        default: stories
      paths:
        description: "Space-separated image (JPEG) or video (MP4) paths in the repo"
        required: true
        type: string
      caption:
        description: "Caption (posts and reels)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/ig_publish.py
        env:
          KIND: ${{ inputs.kind }}
          PATHS: ${{ inputs.paths }}
          CAPTION: ${{ inputs.caption }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
