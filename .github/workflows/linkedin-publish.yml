name: linkedin-publish

# Publish one LinkedIn post by hand (text plus an optional image, PDF or MP4 from the repo).
on:
  workflow_dispatch:
    inputs:
      media:
        description: "Path in the repo (JPEG/PNG, PDF or MP4). Leave empty for text only."
        type: string
        default: ""
      text:
        description: "Post text"
        required: true
        type: string
      title:
        description: "Optional media title"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/li_publish.py
        env:
          MEDIA: ${{ inputs.media }}
          TEXT: ${{ inputs.text }}
          TITLE: ${{ inputs.title }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
