name: overdue

# Hourly safety net (7 AM-11 PM Lagos): opens an alert issue if a due post is >40 min late. Posts nothing.
on:
  schedule:
    - cron: "47 6-22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m autopilot.overdue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
