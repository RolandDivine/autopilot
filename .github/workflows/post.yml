name: post

on:
  # Roland, 29 Oct 2026: "Stop letting GitHub do that". No GitHub timer: the Claude session dispatches this at each slot
  # time (dry_run=false). GitHub only executes.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be posted, post nothing"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: autopilot-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # a queued run must see the log the previous run just pushed, or it could post twice
      - run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post due slots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m autopilot.post --dry-run
          else
            python -m autopilot.post
          fi
      - name: Save log
        if: always()
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add log
          if [ -f control.json ]; then git add control.json; fi
          git diff --cached --quiet || (git commit -m "log: posted $(date -u +%FT%TZ)" && git pull --rebase && git push)
