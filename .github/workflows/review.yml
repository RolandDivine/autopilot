name: review

# Opens or refreshes the day's review issue whenever new posts land in the queue.
on:
  push:
    branches: [main]
    paths: ["queue/**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: autopilot-review

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m autopilot.review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
