name: watchdog

# 9:30 PM Lagos: alert if tomorrow's posts are not queued.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m autopilot.watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
