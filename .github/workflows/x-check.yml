name: x-check

# Confirms the X keys work (one profile lookup, about $0.01 of credits). Posts nothing.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Who am I on X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python - <<'PY'
          import os, requests
          from requests_oauthlib import OAuth1
          a = OAuth1(*(os.environ[k].strip() for k in ("X_API_KEY","X_API_SECRET","X_ACCESS_TOKEN","X_ACCESS_SECRET")))
          r = requests.get("https://api.x.com/2/users/me", auth=a, timeout=30)
          print("HTTP", r.status_code, r.text[:400])
          print("access level:", r.headers.get("x-access-level"))
          if r.ok: print("::notice::X connected as @" + r.json()["data"]["username"])
          else: print("::error::X check failed")
          PY
