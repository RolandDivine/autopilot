<html><head><meta charset=utf-8><style>body{margin:0;width:1080px;height:1920px;background:#050507;overflow:hidden;font-family:'Helvetica Neue',Arial,sans-serif}
.cap{position:absolute;top:150px;width:100%;text-align:center;font-size:58px;font-weight:800;line-height:1.2;color:#fff;letter-spacing:-1px}.cap .g{color:#77777d}.cap .o{color:#f3ba2f}
.tag{position:absolute;font:600 24px sans-serif;color:#fff;background:rgba(20,20,24,.85);border:1px solid #444;padding:6px 14px;border-radius:8px}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<div class=cap>Hackers got <span class=o>one key</span><br><span class=g>to the hot wallet.</span></div>
<div class=tag style="left:640px;top:1180px">Hot wallet</div><div class=tag style="left:250px;top:1500px;color:#f3ba2f">$6.36B</div>
<script type=module>
import * as T from 'three';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(1080,1920);r.toneMapping=T.ACESFilmicToneMapping;document.body.prepend(r.domElement);
const s=new T.Scene();const pm=new T.PMREMGenerator(r);s.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;s.environmentIntensity=0.55;s.fog=new T.Fog(0x050507,18,40);r.toneMappingExposure=1.15;
const c=new T.PerspectiveCamera(30,1080/1920,.1,100);c.position.set(9,8,16);c.lookAt(0.3,1.4,0.8);
s.add(new T.AmbientLight(0xffffff,.25));
const k=new T.SpotLight(0xffe2a0,90,30,.5,.6);k.position.set(3,9,5);s.add(k);
const rim=new T.PointLight(0xff6a00,40,12);rim.position.set(-3,2,-2);s.add(rim);
// vault body
const vm=new T.MeshStandardMaterial({color:0x3a3d44,metalness:.95,roughness:.28});
const v=new T.Mesh(new T.BoxGeometry(3.2,3.2,3.2),vm);v.position.y=1.6;v.rotation.y=-.5;s.add(v);
const door=new T.Mesh(new T.CylinderGeometry(1.1,1.1,.25,64),new T.MeshStandardMaterial({color:0x2c2f36,metalness:1,roughness:.25}));
door.rotation.x=Math.PI/2;door.position.set(0,0,1.65);v.add(door);
const ring=new T.Mesh(new T.TorusGeometry(1.1,.06,16,80),new T.MeshStandardMaterial({color:0xf3ba2f,emissive:0xf3ba2f,emissiveIntensity:1.5}));ring.position.set(0,0,1.78);v.add(ring);
// coins spilling
const cm=new T.MeshStandardMaterial({color:0xf3ba2f,metalness:1,roughness:.2,emissive:0x5a3c00});
for(let i=0;i<60;i++){const m=new T.Mesh(new T.CylinderGeometry(.28,.28,.06,40),cm);
const a=Math.random()*Math.PI*1.2-0.2,d=1.6+Math.random()*3;m.position.set(Math.cos(a)*d-0.5,0.05+Math.random()*1.4*Math.max(0,1-d/4),Math.sin(a)*d+1.2);m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);s.add(m);}
// key
const key=new T.Group();const km=new T.MeshStandardMaterial({color:0xf3ba2f,emissive:0xf3ba2f,emissiveIntensity:.6,metalness:1,roughness:.2});
const h=new T.Mesh(new T.TorusGeometry(.35,.09,16,48),km);key.add(h);const sh=new T.Mesh(new T.BoxGeometry(1.4,.14,.14),km);sh.position.x=1.05;key.add(sh);
const t1=new T.Mesh(new T.BoxGeometry(.14,.3,.14),km);t1.position.set(1.55,-.2,0);key.add(t1);const t2=t1.clone();t2.position.x=1.3;key.add(t2);
key.position.set(0.6,4.6,1.4);key.rotation.set(.3,-.6,-.4);s.add(key);
const fl=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({color:0x0b0b0e,metalness:.6,roughness:.5}));fl.rotation.x=-Math.PI/2;s.add(fl);
r.render(s,c);window.done=1;
</script></body></html>
